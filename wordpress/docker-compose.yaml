services:
  wordpress-app:
    image: wordpress
    restart: always
#    ports:
#      - 8080:80
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: USERNAME
      WORDPRESS_DB_PASSWORD: PASSWORD
      WORDPRESS_DB_NAME: exampledb
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://wordpress.adrien-thibault.de/');
        define('WP_SITEURL', 'http://wordpress.adrien-thibault.de/');
    volumes:
      - ./wordpress:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`wordpress.adrien-thibault.de`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls=true"
      - "traefik.http.routers.wordpress.tls.certresolver=production"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
    networks:
      - web

  wordpress-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: exampledb
      MYSQL_USER: USERNAME
      MYSQL_PASSWORD: PASSWORD
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - ./wordpress-db:/var/lib/mysql
    networks:
      - web

volumes:
  wordpress:
  wordpress-db: